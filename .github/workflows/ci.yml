name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .

  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version pinned in .python-version. This one gates merges.
          - python-version: "3.14"
            experimental: false
          # The next release, currently a release candidate. Advance warning
          # only -- a red canary must not block a merge.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --no-sync python -m compileall -q shooter main.py
      - run: uv run --no-sync python -m pytest -q
