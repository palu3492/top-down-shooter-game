[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "top-down-shooter"
version = "0.1.0"
description = "A top-down zombie wave shooter built with pygame"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pygame-ce>=2.5.5,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
shooter = "shooter.game:game_loop"

[tool.setuptools.packages.find]
include = ["shooter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "SIM", "UP", "N", "RUF"]
# Each entry below is owned by a later ticket in AARON_TICKETS.md; the gate
# tightens as those land. Nothing here is permanent.
ignore = [
    "N801", "N802", "N803", "N806", "N815", "N816",  # AT9
    "F403", "F405",                                   # AT9
    "E501",                                           # AT9
    "F841",                                           # AT8
    "SIM102", "SIM103",                               # AT8
    "B007",                                           # AT8
]
