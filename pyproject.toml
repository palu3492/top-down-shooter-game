[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "top-down-shooter"
version = "0.1.0"
description = "A top-down zombie wave shooter built with pygame"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.5,<3",
    "pygame_gui>=0.6.14,<0.7",
    "pytmx>=3.32",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
shooter = "shooter.game:game_loop"

[tool.setuptools.packages.find]
include = ["shooter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# SDL's dummy driver has no renderer, so SCALED cannot engage headlessly and
# says so on every set_mode. Real displays do not emit this.
filterwarnings = ["ignore:no fast renderer available"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "SIM", "UP", "N", "RUF"]
